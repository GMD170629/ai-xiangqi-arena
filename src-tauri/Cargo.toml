[package]
name = "ai-board-arena"
version = "0.1.0"
description = "AI Board Arena desktop client"
authors = ["GMD170629"]
edition = "2021"

[lib]
name = "ai_board_arena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2.5.9", features = ["unsafe-headers"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-stronghold = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
